[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stalehand"
version = "0.1.0"
description = "Test suite and guards for stale subtask handoffs in hierarchical GUI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
render = ["playwright>=1.45", "pillow>=10"]
stats = ["numpy>=1.26", "scipy>=1.11"]
models = ["torch>=2.3", "transformers>=4.57"]
dev = ["pytest>=8", "jsonschema>=4.20", "pillow>=10"]

[project.scripts]
stalehand = "stalehand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
markers = ["browser: needs Chrome through Playwright"]
