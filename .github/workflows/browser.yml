name: browser

on:
  push:
    paths: ["apps/**", "src/stalehand/env/**", "tests/env/**", ".github/workflows/browser.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: apps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,render]"
      - run: pytest -q -m browser
