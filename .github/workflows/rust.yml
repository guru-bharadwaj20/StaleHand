name: rust

on:
  push:
    paths: ["crates/**", ".github/workflows/rust.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/screendiff
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
